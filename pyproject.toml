[project]
name = "ccrm-saas"
version = "0.1.0"
description = "CCRM SAAS Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.5",
    "django>=6.0.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.13.0",
    "google-cloud-tasks>=2.21.0",
    "gunicorn>=25.1.0",
    "psycopg[binary]>=3.3.3",
    "pyjwt[crypto]>=2.11.0",
    "python-json-logger>=4.0.0",
    "requests>=2.32.5",
    "sentry-sdk>=2.54.0",
    "twilio>=9.10.3",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.12.0",
    "mypy>=1.15.0",
    "freezegun>=1.5.5",
    "factory-boy>=3.3.3",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.pytest.ini_options]
addopts = "--cov=crm --cov=core --cov-report=term-missing --cov-fail-under=80"
