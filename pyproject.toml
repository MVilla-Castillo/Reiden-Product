[project]
name = "ccrm-saas"
version = "0.1.0"
description = "CCRM SAAS Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.5",
    "django>=6.0.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.13.0",
    "google-cloud-tasks>=2.21.0",
    "gunicorn>=25.1.0",
    "psycopg[binary]>=3.3.3",
    "pyjwt[crypto]>=2.11.0",
    "python-json-logger>=4.0.0",
    "requests>=2.32.5",
    "sentry-sdk>=2.54.0",
    "twilio>=9.10.3",
    "uvicorn[standard]>=0.41.0",
    "whitenoise>=6.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.12.0",
    "mypy>=1.15.0",
    "django-stubs[compatible-mypy]>=5.0.0",
    "types-requests>=2.32.0",
    "freezegun>=1.5.5",
    "factory-boy>=3.3.3",
    "ruff>=0.15.10",
    "pre-commit>=4.0.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/", "tests/"]
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "core.settings"

[[tool.mypy.overrides]]
module = [
    "crm.models",
    "crm.admin",
    "crm.adapters.sse.broadcaster",
    "crm.adapters.task_queue.railway_task_queue",
    "crm.management.commands.*",
    "core.views.errors",
    "core.settings",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "crm.views.dashboard_messages",
    "crm.views.dashboard",
    "crm.views.sse",
    "crm.views.scheduler",
    "crm.views.webhook",
    "crm.views.worker",
    "crm.views.sse_ticket",
    "core.auth.oidc",
    "core.log_utils",
    "core.metrics",
]
disable_error_code = ["attr-defined", "union-attr", "no-untyped-def", "no-untyped-call", "no-any-return", "return-value", "type-arg", "assignment", "arg-type"]

[tool.pytest.ini_options]
addopts = "--cov=crm --cov=core --cov-report=term-missing --cov-fail-under=80"
