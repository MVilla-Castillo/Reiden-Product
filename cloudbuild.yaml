steps:
  - id: 'build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ccrm-saas:$COMMIT_SHA'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/ccrm-saas:latest'
      - '.'
    waitFor: ['-']

  - id: 'push'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ccrm-saas:$COMMIT_SHA'
    waitFor: ['build']

  - id: 'migrate'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'exec'
      - 'ccrm-saas-migration'
      - '--region'
      - '${_REGION}'
      - '--'
      - 'python'
      - 'manage.py'
      - 'migrate'
      - '--noinput'
    waitFor: ['push']
    env:
      - 'DJANGO_SETTINGS_MODULE=core.settings'

  - id: 'deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ccrm-saas'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ccrm-saas:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '40'
      - '--set-env-vars'
      - 'DJANGO_SETTINGS_MODULE=core.settings'
      - '--set-secrets'
      - 'DATABASE_URL=ccrm-database-url:latest'
      - '--set-secrets'
      - 'SECRET_KEY=ccrm-secret-key:latest'
      - '--set-secrets'
      - 'TWILIO_ACCOUNT_SID=ccrm-twilio-sid:latest'
      - '--set-secrets'
      - 'TWILIO_AUTH_TOKEN=ccrm-twilio-token:latest'
      - '--set-secrets'
      - 'WA_ID_ENCRYPTION_KEY=ccrm-wa-id-encryption-key:latest'
      - '--set-secrets'
      - 'CLOUD_TASKS_INTERNAL_SECRET=ccrm-internal-secret:latest'
      - '--set-secrets'
      - 'SENTRY_DSN=ccrm-sentry-dsn:latest'
      - '--allow-unauthenticated'
    waitFor: ['migrate']

images:
  - 'gcr.io/$PROJECT_ID/ccrm-saas:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  dynamicSubstitutions: true

substitutions:
  _REGION: 'us-central1'
