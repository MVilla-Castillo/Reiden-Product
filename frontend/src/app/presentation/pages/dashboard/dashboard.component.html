<div class="dashboard">
  <header class="dashboard-header">
    <h1>Panel de {{ isManager() ? 'Gerencia' : 'Ventas' }}</h1>
    <div class="header-actions">
      <span class="role-badge">{{ isManager() ? 'Vista Gerente' : 'Vista Vendedor' }}</span>
      @if (isManager()) {
        <button class="toggle-routing" (click)="toggleRoutingMode()">
          Routing: <strong>{{ tenantSettings().routingMode }}</strong>
        </button>
      }
    </div>
  </header>

  @if (isManager()) {
    <section class="kpi-section">
      <app-kpi-card 
        icon="⚡" 
        [value]="metrics().responseTime.value"
        [trend]="metrics().responseTime.trend"
        label="T. Respuesta Promedio">
      </app-kpi-card>
      <app-kpi-card 
        icon="⚠️" 
        [value]="metrics().pendingAssignments.value.toString()" 
        label="Pendientes de Asignación"
        [critical]="metrics().pendingAssignments.value > 0">
      </app-kpi-card>
      <app-kpi-card 
        icon="👔" 
        [value]="metrics().activeLeads.value.toString()" 
        label="Leads Activos (Vendedores)">
      </app-kpi-card>
      <app-kpi-card 
        icon="🎯" 
        [value]="metrics().closeRate.value" 
        [trend]="metrics().closeRate.trend"
        label="Tasa de Cierre">
      </app-kpi-card>
    </section>
  }

  <section class="leads-section">
    <div class="section-header">
      <h2>{{ isManager() ? 'Leads Pendientes' : 'Mis Leads' }}</h2>
      <span class="lead-count">{{ leads().length }} registros pendientes</span>
    </div>
     <app-leads-grid 
       [leads]="leads()" 
       [salesPersons]="salesPersons()"
       [canAssign]="isManager()">
     </app-leads-grid>
  </section>
</div>
