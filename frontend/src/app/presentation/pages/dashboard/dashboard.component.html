<div class="dashboard">
  <header class="dashboard-header">
    <h1>Panel de {{ isManager() ? 'Gerencia' : 'Ventas' }}</h1>
    <div class="header-actions">
      <span class="role-badge">{{ isManager() ? 'Vista Gerente' : 'Vista Vendedor' }}</span>
      @if (isManager() && tenantSettings()) {
        <button class="toggle-routing" (click)="toggleRoutingMode()">
          Routing: <strong>{{ tenantSettings()!.routing_mode }}</strong>
        </button>
      }
    </div>
  </header>

  @if (isManager() && metrics()) {
    <section class="kpi-section">
      <app-kpi-card 
        icon="⚡" 
        [value]="metrics()!.time_metrics.avg_time_to_first_response + 'm'"
        trend="+0%"
        label="T. Respuesta Promedio">
      </app-kpi-card>
      <app-kpi-card 
        icon="⚠️" 
        [value]="(metrics()!.funnel.total_leads - metrics()!.funnel.assigned_leads).toString()" 
        label="Pendientes de Asignación"
        [critical]="(metrics()!.funnel.total_leads - metrics()!.funnel.assigned_leads) > 0">
      </app-kpi-card>
      <app-kpi-card 
        icon="👔" 
        [value]="metrics()!.funnel.assigned_leads.toString()" 
        label="Leads Asignados (Vendedores)">
      </app-kpi-card>
      <app-kpi-card 
        icon="🎯" 
        [value]="metrics()!.funnel.win_rate + '%'" 
        trend="+0%"
        label="Tasa de Cierre">
      </app-kpi-card>
    </section>
  }

  <section class="leads-section">
    <div class="section-header">
      <h2>{{ isManager() ? 'Leads Pendientes' : 'Mis Leads' }}</h2>
      <span class="lead-count">{{ leads().length }} registros pendientes</span>
    </div>
     <app-leads-grid 
       [leads]="leads()" 
       [salesPersons]="salesPersons()"
       [canAssign]="isManager()">
     </app-leads-grid>
  </section>
</div>
