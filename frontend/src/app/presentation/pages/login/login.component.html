<div class="login-wrapper">
  
  <div class="animated-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="glass-card">
    <div class="card-header">
      <div class="logo-circle">
        <span class="logo-text">CC</span>
      </div>
      <h2>Bienvenido a CCRM</h2>
      <p>Plataforma de Relación Conversacional</p>
    </div>
    
    <div class="user-selection">
      <label>Seleccionar Usuario:</label>
      <select [(ngModel)]="selectedUserId" class="user-select">
        <option value="admin@dev.local">Admin / Gerente (admin@dev.local)</option>
        <option value="gerente@test.com">Gerente (gerente@test.com)</option>
        <option value="vendedor1@dev.local">Vendedor 1 (vendedor1@dev.local)</option>
        <option value="vendedor2@dev.local">Vendedor 2 (vendedor2@dev.local)</option>
        <option value="vendedor1@test.com">Vendedor 1 Test (vendedor1@test.com)</option>
        <option value="vendedor2@test.com">Vendedor 2 Test (vendedor2@test.com)</option>
      </select>
    </div>

    <button class="login-submit" (click)="login()">
      Ingresar al Sistema
      <span class="arrow-icon">→</span>
    </button>
  </div>
</div>
