<div class="login-wrapper">
  
  <div class="animated-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="glass-card">
    @if (errorMessage()) {
      <div class="session-expired-banner" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <div class="card-header">
      <div class="logo-circle">
        <span class="logo-text">CC</span>
      </div>
      <h2>Bienvenido a Stelard</h2>
      <p>Plataforma de Relación Conversacional</p>
    </div>
    
    @if (loginMode() === 'google') {
      <div class="login-method">
        <button class="login-submit google-btn" (click)="loginWithGoogle()" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="loading-spinner"></span>
            Iniciando sesión...
          } @else {
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continuar con Google
          }
        </button>

        <div class="divider">
          <span>o</span>
        </div>

        <button class="toggle-mode-btn" (click)="toggleMode()">
          Ingresar con email y contraseña
        </button>
      </div>
    }

    @if (loginMode() === 'email') {
      <div class="login-method">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email"
            [ngModel]="email()" 
            (ngModelChange)="email.set($event)"
            placeholder="tu@email.com"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password"
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)"
            placeholder="Tu contraseña"
            class="form-input"
          />
        </div>

        <button class="login-submit" (click)="loginWithEmail()" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="loading-spinner"></span>
            Iniciando sesión...
          } @else {
            Ingresar
            <span class="arrow-icon">→</span>
          }
        </button>

        <button class="toggle-mode-btn" (click)="toggleMode()">
          ← Volver a Google
        </button>
      </div>
    }
  </div>
</div>
