<div class="login-wrapper">
  
  <div class="animated-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="glass-card">
    @if (sessionExpiredMessage) {
      <div class="session-expired-banner" role="alert">
        🔒 {{ sessionExpiredMessage }}
      </div>
    }

    <div class="card-header">
      <div class="logo-circle">
        <span class="logo-text">CC</span>
      </div>
      <h2>Bienvenido a CCRM</h2>
      <p>Plataforma de Relación Conversacional</p>
    </div>
    
    <div class="user-selection">
      <label>Seleccionar Usuario:</label>
      <select [(ngModel)]="selectedUserId" class="user-select">
        <option value="admin@dev.local">Admin</option>
        <option value="vendedor1@dev.local">Vendedor 1</option>
        <option value="vendedor2@dev.local">Vendedor 2</option>
      </select>
    </div>

    <button class="login-submit" (click)="login()">
      Ingresar al Sistema
      <span class="arrow-icon">→</span>
    </button>
  </div>
</div>
