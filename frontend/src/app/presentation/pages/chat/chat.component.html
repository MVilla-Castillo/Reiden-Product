<div class="chat-container">
  <aside class="chat-sidebar">
    <div class="sidebar-header">
      <h2>Mis Chats</h2>
    </div>
    <div class="chat-list">
      @for (lead of leads(); track lead.id) {
        <div 
          class="chat-item" 
          [class.active]="selectedSessionId() === lead.id"
          (click)="selectLead(lead.id)">
          <div class="lead-info">
            <span class="lead-name">{{ lead.name }}</span>
            <span class="lead-status">{{ lead.status }}</span>
          </div>
        </div>
      }
    </div>
  </aside>

  <main class="chat-window">
    @if (selectedSessionId()) {
      <div class="chat-header">
        <h3>Chat con {{ selectedSessionId() }}</h3>
      </div>
      <div class="messages-area">
        @for (msg of messages(); track msg.id) {
          <div class="message" [ngClass]="msg.direction === 'OUTBOUND' ? 'sent' : 'received'">
            <div class="bubble">
              {{ msg.body }}
            </div>
            <span class="timestamp">{{ msg.created_at }}</span>
          </div>
        }
      </div>
      <div class="input-area">
        <input 
          [(ngModel)]="newMessage" 
          (keyup.enter)="send()" 
          placeholder="Escribe un mensaje...">
        <button (click)="send()">Enviar</button>
      </div>
    } @else {
      <div class="empty-state">
        <p>Selecciona un chat para comenzar</p>
      </div>
    }
  </main>
</div>
