<div class="empty-state">
  <span class="empty-icon">{{ icon }}</span>
  <p class="empty-title">{{ title }}</p>
  @if (subtitle) {
    <p class="empty-subtitle">{{ subtitle }}</p>
  }
  @if (actionLabel) {
    <button class="empty-action" (click)="action.emit()">{{ actionLabel }}</button>
  }
</div>
