<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <img class="logo-img" src="/landing/Stelard-logo-solo.svg" alt="Stelard" />
      <span class="logo-text">Stelard</span>
    </div>
    <div class="tenant-name">Mi Automotora</div>
  </div>

  <nav class="nav-main">
    @for (item of navItems; track item.route) {
      @if (item.roles.includes(session.currentRole())) {
        <a class="nav-item" [routerLink]="item.route" routerLinkActive="active">
          <app-icon [name]="item.icon" [size]="18"></app-icon>
          {{ item.label }}
        </a>
      }
    }
  </nav>

  <nav class="nav-config">
    <a class="nav-item" routerLink="/settings" routerLinkActive="active">
      <app-icon name="cog" [size]="18"></app-icon>
      Ajustes
    </a>
    <a class="nav-item" routerLink="/profile" routerLinkActive="active">
      <app-icon name="user" [size]="18"></app-icon>
      Perfil
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="role-toggle-compact">
      <button 
        class="role-btn" 
        [class.active]="session.currentRole() === 'manager'"
        (click)="setRole('manager')"
        title="Vista Gerente">
        <app-icon name="briefcase" [size]="16"></app-icon>
      </button>
      <button 
        class="role-btn" 
        [class.active]="session.currentRole() === 'sales'"
        (click)="setRole('sales')"
        title="Vista Vendedor">
        <app-icon name="user" [size]="16"></app-icon>
      </button>
    </div>

    <div class="user-profile">
      <div class="avatar">JD</div>
      <div class="user-info">
        <div class="user-name">Juan Demo</div>
        <div class="user-role">{{ session.currentRole() === 'manager' ? 'Gerente' : 'Vendedor' }}</div>
      </div>
    </div>

    <button class="nav-item logout-btn" (click)="logout()">
      <app-icon name="arrow-right-on-rectangle" [size]="18"></app-icon>
      Cerrar sesión
    </button>
  </div>
</aside>
