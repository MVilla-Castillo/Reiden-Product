<div class="login-wrapper">

  <!-- Top Left Branding -->
  <div class="brand-top-left">
    <img src="assets/logo-pagina-r.svg" alt="Logo R" class="corner-logo" width="24" height="24"
      style="margin-right: 8px;">
    Gerencia Reidenbach
  </div>

  <!-- Bottom Right Branding -->
  <div class="brand-bottom-right">
    <img src="assets/logo-pagina-r.svg" alt="Logo R" class="corner-logo" width="24" height="24">
    Javier Reidenbach
  </div>

  <!-- Center Card -->
  <div class="login-card">

    <div class="logo-container">
      <img src="assets/logo-completo.svg" alt="Automobile Reidenbach" class="main-logo-img">
    </div>

    <h1 class="title">Iniciar Sesión</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <!-- Email / Usuario Input -->
      <div class="input-group">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <input type="text" id="email" formControlName="email" placeholder="Email / Usuario"
          [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" />
      </div>

      <!-- Password Input -->
      <div class="input-group">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <input type="password" id="password" formControlName="password" placeholder="Contraseña"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" />
        <a href="#" class="forgot-password">olvidé mi contraseña</a>
      </div>

      <button type="submit" class="btn-primary">Acceder</button>

      <div class="divider">
        <span>o</span>
      </div>

      <button type="button" class="btn-secondary" (click)="loginWithGoogle()">
        <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4" />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853" />
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            fill="#FBBC05" />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335" />
        </svg>
        continuar con Google
      </button>
    </form>

    <div class="footer-link">
      ¿No tienes una cuenta? <a href="#">Regístrate</a>
    </div>

    <!-- Dev Bypass Buttons -->
    <div class="dev-bypass" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;">
      <p style="font-size: 12px; color: #999; margin-bottom: 10px;">Desarrollo Local (Bypass)</p>
      <div style="display: flex; gap: 10px;">
        <button type="button" class="btn-dev" (click)="loginAsManager()" style="flex: 1; padding: 8px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer;">
          Login Gerente
        </button>
        <button type="button" class="btn-dev" (click)="loginAsSalesperson()" style="flex: 1; padding: 8px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">
          Login Vendedor
        </button>
      </div>
    </div>

  </div>
</div>
