services:
  db:
    image: postgres:15
    container_name: ccrm_db
    environment:
      POSTGRES_DB: ccrm
      POSTGRES_USER: ccrm_user
      POSTGRES_PASSWORD: ccrm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccrm_user -d ccrm"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ccrm_web
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
